name: Build and Publish Docker Image

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # GitHub Packages 에서 nklcbdty-common 다운로드용

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'  # JDK 버전 설정
          distribution: 'adopt'  # JDK 배포판

      - name: Make gradlew executable
        run: chmod +x ./gradlew  # gradlew에 실행 권한 부여

      # 테스트를 안 돌리던 시절엔 nklcbdty-common 의 수정이 반영 안 된 채(옛 버전 pin)
      # 배포돼도 아무도 몰랐다. 자격증명이 필요한 @SpringBootTest 는 스스로 skip 되므로
      # 여기서 도는 건 DB/네트워크 없이 끝나는 단위 테스트뿐이다.
      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test bootJar
        working-directory: ./  # 루트 디렉토리로 설정

      # 이 저장소에는 DOCKER_TOKEN 이 없다(DOCKER_USERNAME 만 있다). 그래서 지금까지 모든 실행이
      # docker/login-action 에서 `Username and password required` 로 빨간불이었다 — 2026-05-17
      # 부터 한 번도 초록인 적이 없다. 진짜 회귀를 가려버리는 상수 노이즈였다. 정작 그 앞의
      # `./gradlew clean test bootJar` 는 매번 통과하고 있었다.
      # 이미지는 78alswo79 포크가 올린다(그쪽엔 두 시크릿이 다 있다).
      #
      # 그래서 자격증명이 있을 때만 로그인·푸시하고, 없으면 빌드·테스트까지만 하고 끝낸다.
      # 초록불을 "배포됨"으로 오해하지 않도록 요약에 이미지가 안 올라갔다고 남긴다.
      # 이 저장소에 DOCKER_TOKEN 을 넣으면 그때부터 여기서 바로 푸시된다(포크 동기화 불필요).
      - name: Check Docker credentials
        id: docker
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.docker.outputs.available == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # CloudType 은 `latest` 를 이미 받아둔 것으로 보고 새 이미지를 pull 하지 않는다.
      # 2026-09-13 기준 운영 컨테이너는 2026-05 빌드였다 — actuator/scheduledtasks 의
      # 링크검증 크론이 `0 30 7 * * *` 였고, 그 값은 b14f6ba~ba45e23 구간 코드에만 있다.
      # 이미지는 8/27 에 올라가 있었으니 태그 이름이 안 바뀐 게 원인이다.
      # 그래서 매 빌드마다 이름이 달라지는 커밋 SHA 태그를 함께 올린다. 처음 보는 태그는
      # 캐시가 없으므로 CloudType 이 반드시 받아온다. `latest` 는 기존 참조용으로 유지.
      - name: Resolve image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: steps.docker.outputs.available == 'true'
        run: |
          docker build \
            --build-arg GITHUB_ACTOR=${{ github.actor }} \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t ejy1024/nklcbdty-batch:latest \
            -t ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }} .

      - name: Push Docker image
        if: steps.docker.outputs.available == 'true'
        run: |
          docker push ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }}
          docker push ejy1024/nklcbdty-batch:latest

      # CloudType 콘솔에 넣을 태그를 Actions 요약에 남긴다.
      # 이 태그로 바꿔야 재배포가 실제로 새 코드를 올린다.
      - name: Write deploy hint
        if: steps.docker.outputs.available == 'true'
        run: |
          {
            echo "### CloudType 에 넣을 이미지 태그"
            echo
            echo '```'
            echo "ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }}"
            echo '```'
            echo
            echo "콘솔에서 이미지 태그를 위 값으로 바꾼 뒤 재배포하면 캐시를 우회해 새 코드가 뜬다."
            echo "떠 있는 빌드는 \`/actuator/scheduledtasks\` 의 크론으로 확인할 수 있다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 초록불을 "배포됨"으로 오해하지 않게 한다. 이미지는 아무 데도 안 올라갔다.
      - name: Write publish-skipped notice
        if: steps.docker.outputs.available != 'true'
        run: |
          {
            echo "### ⚠️ 이미지는 올라가지 않았다 (빌드·테스트만 통과)"
            echo
            echo "이 저장소에 \`DOCKER_TOKEN\` 시크릿이 없어 Docker Hub 푸시를 건너뛰었다."
            echo
            echo "- 지금 이미지를 올리려면: 78alswo79 포크에 \`kingle1024:main\` → \`main\` PR 을 머지한다."
            echo "- 앞으로 여기서 바로 올리려면: 이 저장소 Settings > Secrets 에 \`DOCKER_TOKEN\` 을 넣는다."
            echo
            echo "떠 있는 빌드는 \`/actuator/scheduledtasks\` 의 크론으로 확인할 수 있다."
          } >> "$GITHUB_STEP_SUMMARY"
